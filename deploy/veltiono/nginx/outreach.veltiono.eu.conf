# Quickly (outreach.veltiono.eu) → 127.0.0.1:5050 (= QUICKLY_PORT in .env; change both together). Install:
#   cp outreach.veltiono.eu.conf /etc/nginx/sites-available/ && ln -s ../sites-available/outreach.veltiono.eu.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx && certbot --nginx -d outreach.veltiono.eu --redirect
server {
    listen 80;
    listen [::]:80;
    server_name outreach.veltiono.eu;

    client_max_body_size 20m;          # CSV lead imports

    location / {
        proxy_pass http://127.0.0.1:5050;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        # Unibox live updates are Server-Sent Events: no buffering, long reads.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
}
