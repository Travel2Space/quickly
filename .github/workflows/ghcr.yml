name: Image (GHCR)
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  packages: write
jobs:
  image:
    if: github.repository == 'Travel2Space/quickly'
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_PASSWORD: pg }
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: quickly:verify
          labels: |
            org.opencontainers.image.source=https://github.com/Travel2Space/quickly
      - name: Smoke-test the image against Postgres
        run: |
          docker run -d --network host -e DATABASE_URL=postgresql+asyncpg://postgres:pg@127.0.0.1:5432/postgres \
            quickly:verify
          curl -sf --retry 30 --retry-delay 2 --retry-connrefused http://127.0.0.1:8000/health
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - name: Publish the verified image
        run: |
          docker tag quickly:verify ghcr.io/travel2space/quickly:${{ github.ref_name }}
          docker push ghcr.io/travel2space/quickly:${{ github.ref_name }}
